<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Perfectly centered omnidirectional ambient depth (dx=0, dy=0) -->
    <filter id="centerDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Liquid Upper Gradient: Electric Cyan (Gemini 5h Active Window) -->
    <linearGradient id="liquidCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <!-- Liquid Lower Gradient: Electric Amber (Claude / Weekly Limit) -->
    <linearGradient id="liquidAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>

    <!-- Glass Rim Metallic Stroke Gradient -->
    <linearGradient id="glassStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="65%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Caps Gradient: Dark Titanium -->
    <linearGradient id="capTitanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#centerDepth)">
    <!-- Titanium Caps (Mathematically identical at top and bottom) -->
    <!-- Top Cap (y=32 to 46, center Y=39, center X=128) -->
    <rect x="48" y="32" width="160" height="14" rx="7" fill="url(#capTitanium)" stroke="#475569" stroke-width="1.5"/>
    <line x1="56" y1="36" x2="200" y2="36" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <circle cx="128" cy="39" r="2.5" fill="#38bdf8" filter="url(#neon)"/>

    <!-- Bottom Cap (y=210 to 224, center Y=217, center X=128) -->
    <rect x="48" y="210" width="160" height="14" rx="7" fill="url(#capTitanium)" stroke="#475569" stroke-width="1.5"/>
    <line x1="56" y1="214" x2="200" y2="214" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <circle cx="128" cy="217" r="2.5" fill="#f59e0b" filter="url(#neon)"/>

    <!-- Glass Interior Tint (Symmetrical) -->
    <path d="M 60,46 L 196,46 C 196,87 152,116 148,128 C 152,116 196,87 196,46 Z" fill="#0284c7" fill-opacity="0.12"/>
    <path d="M 108,128 C 104,140 60,169 60,210 L 196,210 C 196,169 152,140 148,128 Z" fill="#ea580c" fill-opacity="0.1"/>

    <!-- Top Plasma Liquid (Antigravity Pool, collected at top) -->
    <path d="M 60,46 L 196,46 C 196,78 168,98 150,106 L 106,106 C 88,98 60,78 60,46 Z" 
          fill="url(#liquidCyan)" opacity="0.9" filter="url(#neon)"/>
    <ellipse cx="128" cy="48" rx="64" ry="5" fill="#e0f2fe" opacity="0.95"/>

    <!-- Bottom Reserve Liquid (Weekly Pool - Equal height and mass for perfect balance!) -->
    <path d="M 106,150 L 150,150 C 168,158 196,178 196,210 L 60,210 C 60,178 88,158 106,150 Z" 
          fill="url(#liquidAmber)" opacity="0.85" filter="url(#neon)"/>
    <ellipse cx="128" cy="208" rx="64" ry="5" fill="#fde68a" opacity="0.9"/>

    <!-- Main Glass Body Contour (Full, wide, robust curve, 100% mirrored) -->
    <path d="M 60,46 
             C 60,87 104,116 108,128 
             C 104,140 60,169 60,210 
             L 196,210 
             C 196,169 152,140 148,128 
             C 152,116 196,87 196,46 
             Z" 
          fill="none" 
          stroke="url(#glassStroke)" 
          stroke-width="5" 
          stroke-linejoin="round"/>

    <!-- Symmetrical Calibration Ticks (Inside the glass) -->
    <!-- Top Chamber Ticks (Cyan, Gemini 5h) -->
    <line x1="66" y1="66" x2="78" y2="66" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="71" y1="84" x2="81" y2="84" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="80" y1="102" x2="88" y2="102" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="190" y1="66" x2="178" y2="66" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="185" y1="84" x2="175" y2="84" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="176" y1="102" x2="168" y2="102" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>

    <!-- Bottom Chamber Ticks (Amber, Weekly Quota) - Perfectly mirrored across y=128! -->
    <line x1="80" y1="154" x2="88" y2="154" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="71" y1="172" x2="81" y2="172" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="66" y1="190" x2="78" y2="190" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="176" y1="154" x2="168" y2="154" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="185" y1="172" x2="175" y2="172" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="190" y1="190" x2="178" y2="190" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Center Antigravity Quantum Stream (Vertical laser corridor) -->
    <line x1="128" y1="92" x2="128" y2="164" stroke="#ffffff" stroke-width="2" opacity="0.6" stroke-dasharray="2 3"/>

    <!-- Ascending Quantum Chevron (Centered at x=128, y=128) -->
    <path d="M 120,132 L 128,124 L 136,132" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)"/>

    <!-- Symmetrically Distributed Zero-G Particles -->
    <g filter="url(#neon)">
      <!-- Core center particle -->
      <circle cx="128" cy="128" r="3.5" fill="#ffffff" />
      
      <!-- Upper ascending particles -->
      <circle cx="128" cy="112" r="3" fill="#38bdf8" />
      <circle cx="128" cy="94" r="3.5" fill="#7dd3fc" />
      <circle cx="116" cy="74" r="2.5" fill="#38bdf8" />
      <circle cx="140" cy="74" r="2.5" fill="#38bdf8" />
      <circle cx="128" cy="60" r="4" fill="#e0f2fe" />

      <!-- Lower ascending particles -->
      <circle cx="128" cy="144" r="3" fill="#fbbf24" />
      <circle cx="128" cy="162" r="3.5" fill="#f59e0b" />
      <circle cx="116" cy="182" r="2.5" fill="#f59e0b" />
      <circle cx="140" cy="182" r="2.5" fill="#f59e0b" />
      <circle cx="128" cy="196" r="4" fill="#fef08a" />
    </g>

    <!-- Glass Specular Curved Highlights (Balanced on left and right) -->
    <path d="M 68,52 C 68,84 96,112 100,120" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    <path d="M 188,52 C 188,84 160,112 156,120" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
    <path d="M 68,204 C 68,172 96,144 100,136" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M 188,204 C 188,172 160,144 156,136" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
  </g>
</svg>

