<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad4C" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151322"/>
      <stop offset="100%" stop-color="#0B0914"/>
    </linearGradient>

    <!-- Continuous Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="30%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="glow4C" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad4C)" stroke="#2B263E" stroke-width="2"/>

  <!-- Inactive Base Track (260 deg arc) -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="#221E33" stroke-width="14" stroke-linecap="round"/>

  <!-- Active Orbit Meter Arc -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="url(#ribbonGrad)" stroke-width="14" 
          stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="110" 
          transform="rotate(-110 128 128)" filter="url(#glow4C)"/>

  <!-- Futuristic Minimalist 'A' Chevron Apex (Y from 80 to 176 -> Center = 128) -->
  <path d="M 128 80 L 166 176 L 146 176 L 128 130 L 110 176 L 90 176 Z" fill="url(#ribbonGrad)"/>
  
  <!-- Sleek Crossbar Bar / Meter Pulse -->
  <rect x="108" y="142" width="40" height="9" rx="4.5" fill="#FFFFFF"/>
</svg>

