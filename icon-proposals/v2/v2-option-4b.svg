<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad4B" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141522"/>
      <stop offset="100%" stop-color="#0A0B10"/>
    </linearGradient>

    <!-- Gemini 5h Cyan Gradient -->
    <linearGradient id="cyanArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Claude Weekly Amber Gradient -->
    <linearGradient id="amberArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <!-- Antigravity Core A Gradient -->
    <linearGradient id="coreAGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <filter id="glow4B" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad4B)" stroke="#23263B" stroke-width="2"/>

  <!-- Outer Track (Inactive) -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="#1D2030" stroke-width="10" stroke-linecap="round"/>
  <!-- Inner Track (Inactive) -->
  <circle cx="128" cy="128" r="66" fill="none" stroke="#1D2030" stroke-width="8" stroke-linecap="round"/>

  <!-- Outer Arc: 5h Window (Gemini Cyan) -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="url(#cyanArc)" stroke-width="10" 
          stroke-linecap="round" stroke-dasharray="395" stroke-dashoffset="95" 
          transform="rotate(-135 128 128)" filter="url(#glow4B)"/>

  <!-- Inner Arc: Weekly Limit (Claude Amber) -->
  <circle cx="128" cy="128" r="66" fill="none" stroke="url(#amberArc)" stroke-width="8" 
          stroke-linecap="round" stroke-dasharray="310" stroke-dashoffset="100" 
          transform="rotate(-45 128 128)" filter="url(#glow4B)"/>

  <!-- Center 'A' Monogram (Y: 90 to 166 -> Center = 128) -->
  <path d="M 128 90 L 160 166 L 144 166 L 128 126 L 112 166 L 96 166 Z" fill="url(#coreAGrad)"/>
  <rect x="110" y="140" width="36" height="7" rx="3.5" fill="#38BDF8"/>
</svg>

