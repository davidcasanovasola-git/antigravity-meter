<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad4E" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1829"/>
      <stop offset="100%" stop-color="#0E0D17"/>
    </linearGradient>

    <linearGradient id="neonElectric" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <filter id="glow4E" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad4E)" stroke="#2F2B45" stroke-width="2"/>

  <!-- Background Track Ring -->
  <circle cx="128" cy="128" r="82" fill="none" stroke="#252238" stroke-width="14" stroke-linecap="round"/>

  <!-- Active 75% Meter Arc -->
  <circle cx="128" cy="128" r="82" fill="none" stroke="url(#neonElectric)" stroke-width="14" 
          stroke-linecap="round" stroke-dasharray="386" stroke-dashoffset="100" 
          transform="rotate(-90 128 128)" filter="url(#glow4E)"/>

  <!-- Bold Modern 'A' Glyph (Y: 82 to 174 -> Center = 128) -->
  <path d="M 128 82 L 168 174 L 146 174 L 128 132 L 110 174 L 88 174 Z" fill="url(#neonElectric)"/>
  
  <!-- Glowing Horizontal Bar -->
  <rect x="106" y="144" width="44" height="9" rx="4.5" fill="#FFFFFF"/>
</svg>

