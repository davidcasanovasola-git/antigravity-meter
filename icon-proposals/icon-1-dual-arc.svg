<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181926"/>
      <stop offset="100%" stop-color="#0F1017"/>
    </linearGradient>

    <!-- Cyan Arc Gradient (Gemini) -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Amber Arc Gradient (Claude) -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>

    <!-- Subtle Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad)" stroke="#2D3148" stroke-width="2"/>

  <!-- Background Track Rings -->
  <circle cx="128" cy="128" r="76" fill="none" stroke="#25283B" stroke-width="14" stroke-linecap="round"/>
  <circle cx="128" cy="128" r="50" fill="none" stroke="#25283B" stroke-width="12" stroke-linecap="round"/>

  <!-- Outer Arc: 5h Window (Gemini Cyan) -->
  <circle cx="128" cy="128" r="76" fill="none" stroke="url(#cyanGrad)" stroke-width="14" 
          stroke-linecap="round" stroke-dasharray="358" stroke-dashoffset="85"
          transform="rotate(-135 128 128)" filter="url(#glow)"/>

  <!-- Inner Arc: Weekly Limit (Claude Amber/Coral) -->
  <circle cx="128" cy="128" r="50" fill="none" stroke="url(#amberGrad)" stroke-width="12" 
          stroke-linecap="round" stroke-dasharray="235" stroke-dashoffset="70"
          transform="rotate(-45 128 128)" filter="url(#glow)"/>

  <!-- Center Indicator Dot -->
  <circle cx="128" cy="128" r="14" fill="#1E202E" stroke="#38BDF8" stroke-width="3"/>
  <circle cx="128" cy="128" r="6" fill="#38BDF8"/>
</svg>

