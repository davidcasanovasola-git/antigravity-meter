<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- Metallic Cap Gradient -->
    <linearGradient id="metalCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Floating Core Orb 1 (Gemini Blue) -->
    <radialGradient id="orbGem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <!-- Floating Core Orb 2 (Claude Coral/Amber) -->
    <radialGradient id="orbClaude" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </radialGradient>

    <filter id="capGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bgCap)" stroke="#1e293b" stroke-width="2"/>

  <!-- Zero-G Tube Outer Halo -->
  <rect x="76" y="42" width="104" height="172" rx="52" fill="#0284c7" opacity="0.08" filter="url(#capGlow)"/>

  <!-- Metallic Top Cap Mount -->
  <rect x="90" y="32" width="76" height="18" rx="6" fill="url(#metalCap)" stroke="#475569" stroke-width="1.5"/>
  <circle cx="128" cy="41" r="3" fill="#10b981" filter="url(#subtleG)"/> <!-- Status Green LED -->

  <!-- Metallic Bottom Base Mount -->
  <rect x="90" y="206" width="76" height="18" rx="6" fill="url(#metalCap)" stroke="#475569" stroke-width="1.5"/>
  <circle cx="128" cy="215" r="3" fill="#38bdf8" filter="url(#subtleG)"/>

  <!-- Translucent Glass Cylinder Body -->
  <rect x="76" y="44" width="104" height="168" rx="52" 
        fill="#0f172a" fill-opacity="0.6" 
        stroke="#38bdf8" stroke-opacity="0.6" stroke-width="3"/>

  <!-- Magnetic Containment Field Ring Lines (Suspension Rings) -->
  <ellipse cx="128" cy="92" rx="46" ry="10" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <ellipse cx="128" cy="128" rx="48" ry="10" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <ellipse cx="128" cy="164" rx="46" ry="10" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Central Vertical Levitation Beam -->
  <line x1="128" y1="64" x2="128" y2="192" stroke="#bae6fd" stroke-width="1.5" opacity="0.4" stroke-dasharray="2 3"/>

  <!-- Floating Levitating Plasma Sphere 1 (Gemini 5h Token) -->
  <circle cx="128" cy="100" r="26" fill="url(#orbGem)" filter="url(#capGlow)"/>
  <!-- Specular highlight on Orb 1 -->
  <circle cx="120" cy="92" r="7" fill="#ffffff" opacity="0.6"/>

  <!-- Floating Levitating Plasma Sphere 2 (Claude / Weekly Token) -->
  <circle cx="128" cy="156" r="20" fill="url(#orbClaude)" filter="url(#capGlow)"/>
  <!-- Specular highlight on Orb 2 -->
  <circle cx="122" cy="150" r="5" fill="#ffffff" opacity="0.6"/>

  <!-- Micro Anti-Gravity Sparks floating between orbs -->
  <circle cx="112" cy="128" r="2.5" fill="#38bdf8" filter="url(#subtleG)"/>
  <circle cx="142" cy="132" r="2" fill="#fbbf24" filter="url(#subtleG)"/>
  <circle cx="128" cy="128" r="3" fill="#ffffff" filter="url(#subtleG)"/>

  <!-- Gauge Measurement Graduation Ticks on Right Glass Wall -->
  <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
    <line x1="172" y1="72" x2="182" y2="72" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="174" y1="92" x2="180" y2="92" stroke="#38bdf8" />
    <line x1="172" y1="112" x2="182" y2="112" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="174" y1="132" x2="180" y2="132" stroke="#f59e0b" />
    <line x1="172" y1="152" x2="182" y2="152" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="174" y1="172" x2="180" y2="172" stroke="#f59e0b" />
  </g>

  <!-- Vertical Cylindrical Glass Gloss Reflection (Left Edge Highlight) -->
  <path d="M 88,68 C 84,84 84,172 88,188" 
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
</svg>

