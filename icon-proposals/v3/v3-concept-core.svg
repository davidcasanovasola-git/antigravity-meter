<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Crystal Gradients -->
    <linearGradient id="cTopL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="cTopR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="cBotL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="cBotR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate / Canvas -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Ambient Glow in center -->
  <circle cx="128" cy="128" r="70" fill="#3b82f6" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- Meter Scale on Left Side -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="42" y1="76" x2="42" y2="180" />
    <!-- Ticks -->
    <line x1="36" y1="76" x2="46" y2="76" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="38" y1="97" x2="44" y2="97" stroke="#38bdf8" />
    <line x1="36" y1="118" x2="46" y2="118" stroke="#38bdf8" />
    <line x1="38" y1="138" x2="44" y2="138" />
    <line x1="36" y1="159" x2="46" y2="159" />
    <line x1="36" y1="180" x2="46" y2="180" />
  </g>
  <!-- Active Indicator Pip on Meter -->
  <circle cx="42" cy="97" r="3.5" fill="#38bdf8" filter="url(#subtleGlow)"/>

  <!-- Energy Field Ring (Zero-G Levitation Plane) -->
  <ellipse cx="128" cy="128" rx="72" ry="16" fill="none" stroke="url(#ringGrad)" stroke-width="3.5" filter="url(#neonGlow)" />
  <ellipse cx="128" cy="128" rx="72" ry="16" fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.8" />

  <!-- Central Laser Core Beam -->
  <line x1="128" y1="88" x2="128" y2="168" stroke="#38bdf8" stroke-width="6" opacity="0.4" filter="url(#neonGlow)"/>
  <line x1="128" y1="102" x2="128" y2="154" stroke="#ffffff" stroke-width="2" filter="url(#subtleGlow)"/>

  <!-- Floating Crystal - Top Half -->
  <g>
    <!-- Left Facet -->
    <polygon points="128,46 72,114 128,114" fill="url(#cTopL)"/>
    <!-- Right Facet -->
    <polygon points="128,46 184,114 128,114" fill="url(#cTopR)"/>
    <!-- Bottom Rim of Top Half (creates 3D depth) -->
    <polygon points="72,114 128,120 184,114 128,114" fill="#1e3a8a" opacity="0.6"/>
    <!-- Center Spine Highlight -->
    <line x1="128" y1="46" x2="128" y2="114" stroke="#bae6fd" stroke-width="2"/>
    <!-- Outer Edge Glow -->
    <polyline points="72,114 128,46 184,114" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Floating Crystal - Bottom Half -->
  <g>
    <!-- Left Facet -->
    <polygon points="72,142 128,210 128,142" fill="url(#cBotL)"/>
    <!-- Right Facet -->
    <polygon points="184,142 128,210 128,142" fill="url(#cBotR)"/>
    <!-- Top Rim of Bottom Half -->
    <polygon points="72,142 128,136 184,142 128,142" fill="#312e81" opacity="0.6"/>
    <!-- Center Spine Highlight -->
    <line x1="128" y1="142" x2="128" y2="210" stroke="#c7d2fe" stroke-width="2"/>
    <!-- Outer Edge Glow -->
    <polyline points="72,142 128,210 184,142" fill="none" stroke="#a5b4fc" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- Floating Quantum Particles (Defying Gravity) -->
  <circle cx="106" cy="120" r="2" fill="#ffffff" filter="url(#subtleGlow)"/>
  <circle cx="150" cy="122" r="2.5" fill="#38bdf8" filter="url(#subtleGlow)"/>
  <circle cx="120" cy="136" r="1.5" fill="#c084fc" filter="url(#subtleGlow)"/>
  <circle cx="138" cy="133" r="2" fill="#ffffff" filter="url(#subtleGlow)"/>

  <!-- Meter Readout Ticks on Right Side (Weekly Window) -->
  <g stroke="#334155" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="214" y1="76" x2="214" y2="180" />
    <!-- Ticks -->
    <line x1="210" y1="76" x2="220" y2="76" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="212" y1="97" x2="218" y2="97" stroke="#f59e0b"/>
    <line x1="210" y1="118" x2="220" y2="118" stroke="#f59e0b"/>
    <line x1="212" y1="138" x2="218" y2="138" stroke="#f59e0b"/>
    <line x1="210" y1="159" x2="220" y2="159" />
    <line x1="210" y1="180" x2="220" y2="180" />
  </g>
  <circle cx="214" cy="138" r="3.5" fill="#f59e0b" filter="url(#subtleGlow)"/>
</svg>

