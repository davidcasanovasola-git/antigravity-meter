<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151F"/>
      <stop offset="100%" stop-color="#090A0E"/>
    </linearGradient>

    <!-- Emerald Glow -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Container -->
  <rect x="12" y="12" width="232" height="232" rx="54" fill="url(#bgGrad2)" stroke="#222538" stroke-width="2"/>

  <!-- Gauge Track (240 degrees arc) -->
  <!-- Critical Segment (Red) -->
  <path d="M 64 176 A 78 78 0 0 1 68 84" fill="none" stroke="#EF4444" stroke-width="14" stroke-linecap="round" opacity="0.85"/>

  <!-- Warning Segment (Amber) -->
  <path d="M 76 74 A 78 78 0 0 1 128 50" fill="none" stroke="#F59E0B" stroke-width="14" stroke-linecap="round" opacity="0.9"/>

  <!-- Healthy / Full Segment (Emerald Green with Gradient) -->
  <path d="M 138 50 A 78 78 0 0 1 192 176" fill="none" stroke="url(#greenGrad)" stroke-width="14" stroke-linecap="round"/>

  <!-- Ticks -->
  <circle cx="64" cy="176" r="3" fill="#64748B"/>
  <circle cx="128" cy="46" r="3" fill="#64748B"/>
  <circle cx="192" cy="176" r="3" fill="#64748B"/>

  <!-- Center Hub -->
  <circle cx="128" cy="148" r="22" fill="#1E202E" stroke="#334155" stroke-width="3"/>
  <circle cx="128" cy="148" r="10" fill="#38BDF8"/>

  <!-- Sleek Needle pointing to ~75% (Safe Zone) -->
  <polygon points="125,148 131,148 168,88 128,142" fill="url(#needleGrad)"/>
</svg>

